<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Upcoming and past talks by Minchang Kim.">
  <meta name="theme-color" content="#f7f6f2">
  <title>Talks | Minchang Kim</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f6f2;
      --surface: #ffffff;
      --ink: #202b33;
      --muted: #63717a;
      --rule: #dedfd8;
      --accent: #276b68;
      --accent-dark: #194c4b;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent-dark); }
    a:hover { color: var(--accent); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .container { width: min(100% - 48px, 1020px); margin-inline: auto; }
    .site-header { border-bottom: 1px solid var(--rule); }
    .header-inner {
      min-height: 86px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .wordmark {
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.22rem;
      font-weight: 700;
      letter-spacing: -.035em;
      text-decoration: none;
      white-space: nowrap;
    }
    .nav { display: flex; gap: clamp(15px, 3vw, 34px); flex-wrap: wrap; }
    .nav a {
      color: var(--muted);
      font-size: .87rem;
      font-weight: 600;
      text-decoration: none;
    }
    .nav a:hover, .nav a[aria-current="page"] { color: var(--accent-dark); }
    .eyebrow, .section-label {
      color: var(--accent);
      font-size: .73rem;
      font-weight: 750;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; }

    .hero {
      padding: clamp(76px, 11vw, 136px) 0 72px;
      border-bottom: 1px solid var(--rule);
    }
    .hero .eyebrow { margin: 0 0 20px; }
    h1 {
      margin: 0 0 20px;
      font-size: clamp(4rem, 9vw, 7rem);
      line-height: 1;
      letter-spacing: -.065em;
    }
    .hero-description {
      max-width: 630px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(1.04rem, 2vw, 1.25rem);
    }
    .talk-section { padding: 60px 0 80px; }
    .talk-section + .talk-section { border-top: 1px solid var(--rule); }
    .talk-section[hidden] { display: none; }
    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 28px;
    }
    .section-heading h2 {
      margin: 0;
      font-size: clamp(2.1rem, 4vw, 3.1rem);
      letter-spacing: -.045em;
      line-height: 1.16;
    }
    .section-heading span { color: var(--muted); font-size: .85rem; }
    .talk-list { display: grid; gap: 20px; }
    .talk-card {
      padding: clamp(26px, 4vw, 42px);
      border: 1px solid var(--rule);
      border-radius: 4px;
      background: var(--surface);
      box-shadow: 0 12px 32px rgba(32, 43, 51, .035);
    }
    .talk-card .section-label { margin: 0 0 16px; }
    .talk-card h3 {
      max-width: 750px;
      margin: 0 0 11px;
      font-size: clamp(1.55rem, 3vw, 2.25rem);
      line-height: 1.26;
      letter-spacing: -.035em;
    }
    .talk-event { margin: 0; color: var(--muted); }
    .talk-time {
      margin: 23px 0;
      padding: 17px 0;
      border-block: 1px solid var(--rule);
      font-size: .91rem;
      font-weight: 650;
    }
    .talk-summary { max-width: 730px; margin: 0 0 14px; color: #3c4a52; }
    .talk-attendance { margin: 25px 0 16px; color: var(--muted); font-size: .92rem; }
    .talk-link { display: inline-block; font-size: .91rem; font-weight: 700; }
    .empty-state { margin: 0; padding: 30px 0; color: var(--muted); }
    .return-link {
      display: inline-block;
      margin-bottom: 64px;
      font-size: .9rem;
      font-weight: 700;
      text-decoration: none;
    }
    footer {
      border-top: 1px solid var(--rule);
      padding: 22px 0 30px;
      color: var(--muted);
      font-size: .82rem;
    }
    @media (max-width: 720px) {
      .container { width: min(100% - 36px, 1020px); }
      .header-inner { min-height: 75px; }
      .nav { gap: 14px; }
      .nav a { font-size: .78rem; }
      .talk-section { padding: 44px 0 60px; }
      .section-heading { flex-direction: column; gap: 4px; }
    }
    @media (max-width: 450px) {
      .header-inner { align-items: flex-start; flex-direction: column; gap: 8px; padding: 18px 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="wordmark" href="index.html">Minchang Kim</a>
      <nav class="nav" aria-label="Main navigation">
        <a href="index.html#research">Research</a>
        <a href="index.html#papers">Papers</a>
        <a href="conferences.html">Conferences</a>
        <a href="talks.html" aria-current="page">Talks</a>
        <a href="cv.pdf" target="_blank" rel="noopener noreferrer">CV ↗</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Mathematics · Seminars</p>
      <h1 id="page-title">Talks<span style="color: var(--accent)">.</span></h1>
      <p class="hero-description">Upcoming presentations and an archive of past talks.</p>
    </section>

    <section class="talk-section" aria-labelledby="upcoming-title">
      <div class="section-heading">
        <h2 id="upcoming-title">Upcoming talks</h2>
        <span>Listed by date</span>
      </div>
      <div class="talk-list" id="upcoming-talks"></div>
    </section>

    <section class="talk-section" id="past-section" aria-labelledby="past-title" hidden>
      <div class="section-heading">
        <h2 id="past-title">Past talks</h2>
        <span>Most recent first</span>
      </div>
      <div class="talk-list" id="past-talks"></div>
    </section>

    <a class="return-link" href="index.html">← Back to home</a>
  </main>

  <footer><div class="container">© 2026 Minchang Kim</div></footer>
  <script src="talks.js" defer></script>
</body>
</html>
